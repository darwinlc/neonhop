.lbl{font-size:11px;letter-spacing:.25em;color:#8ff;opacity:.75}
.val{font-size:28px;font-weight:800;text-shadow:0 0 12px #0ff}

.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at center,rgba(30,0,60,.45),rgba(5,0,15,.88));gap:14px;padding:24px;z-index:5}

.sub{color:#cfeff8;font-size:12px;letter-spacing:.16em;opacity:.85;line-height:2}
.sub b{font-weight:800}
.big{font-size:44px;font-weight:800;color:#0ff;text-shadow:0 0 16px #0ff}

.hidden{display:none!important}
.overlay{overflow-y:auto;justify-content:safe center}
.btn.alt{border-color:#ffe46b;color:#ffe46b;box-shadow:0 0 14px rgba(255,228,107,.6),inset 0 0 10px rgba(255,228,107,.3);animation:none;padding:10px 26px;font-size:13px;margin-top:0}
.board{font-size:11px;letter-spacing:.08em;border-collapse:collapse;color:#cfeff8;margin:0 auto}
.board td{padding:3px 8px;text-align:right}
.board td.h{opacity:.55}
.board tr.me td{color:#ffe46b;text-shadow:0 0 8px #ffb400}
#midSub{font-size:9px;margin-top:2px}

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// =====================================================================
// STAGE DATA — plain JSON-able object, so a future stage editor can
// produce / load it directly.
//
// bars: one string per bar (4 beats). Cell codes:
//   F  floor           – nothing to do
//   G  gap             – jump on this beat
//   B  barrier         – jump on this beat (static red wall)
//   M  pop-up wall     – jump on this beat (red wall pumping to the beat)
//   D  crusher         – DON'T jump on this beat (slams on the off-beat)
//   U  gravity portal  – jump on this beat; gravity flips mid-air
// checkpoints: at the start of `bar`, optionally change tempo (bpm)
//   and camera: 'left' | 'right' (side of screen the cube is on), 'low', 'high'.
// The stage ends after the last bar (finish gate).
// =====================================================================
const BUILTIN_STAGE = {
  id: 'neon-run-1',
  name: 'NEON RUN',
  bpm: 128,
  cam: 'left',
  seed: 7,
  bars: [
    // 0 · warm-up
    'FFFF', 'FFFF', 'GFFF', 'FFGF', 'GFGF', 'BFFF', 'FFBF', 'GFBF',
    // 8 · pop-up walls
    'MFFF', 'FFMF', 'GFMF', 'MFGF', 'BFMF', 'GFGF', 'MFMF', 'GFBF',
    // 16 · crushers (don't jump!)
    'FFDF', 'GFDF', 'FDGF', 'MFDF', 'DFGF', 'GDGF', 'BFDD', 'GFMD',
    // 24 · antigravity
    'FFFF', 'UFFF', 'GFGF', 'BFMF', 'GFDF', 'MFGF', 'GGFF', 'FDUF',
    // 32 · back to earth, faster
    'FFFF', 'GFGG', 'MFDF', 'GBGF', 'DFMF', 'GGMF', 'UFGF', 'GFMF',
    // 40 · upside-down rush
    'DFGF', 'GGBF', 'MDGF', 'GFGG', 'BDMF', 'GGGF', 'FMDF', 'GUFF',
    // 48 · finale
    'GFGF', 'MFMF', 'GGGG', 'BGBG', 'MDMD', 'GGMF', 'DGDG', 'GFFF'
  ],
  checkpoints: [
    { bar: 8,  bpm: 136, cam: 'right' },
    { bar: 16, bpm: 140, cam: 'low' },
    { bar: 24, bpm: 144, cam: 'left' },
    { bar: 32, bpm: 150, cam: 'right' },
    { bar: 40, bpm: 156, cam: 'low' },
    { bar: 48, bpm: 160, cam: 'high' }
  ]
};

// ---------- custom stages from the editor: #s=<base64 json>&from=<bar>&auto=1 ----------
const CAM_NAMES = ['left', 'right', 'low', 'high'];
function sanitizeStage(o) {
  if (!o || !Array.isArray(o.bars) || !o.bars.length) return null;
  const clampBpm = v => Math.max(60, Math.min(240, Math.round(+v) || 128));
  const bars = o.bars.slice(0, 999).map(b => String(b).toUpperCase().replace(/[^FGBMDU]/g, 'F').padEnd(4, 'F').slice(0, 4));
  const checkpoints = (Array.isArray(o.checkpoints) ? o.checkpoints : [])
    .map(c => ({ bar: Math.floor(+c.bar), bpm: c.bpm ? clampBpm(c.bpm) : undefined, cam: CAM_NAMES.includes(c.cam) ? c.cam : undefined }))
    .filter(c => c.bar > 0 && c.bar < bars.length).sort((a, z) => a.bar - z.bar);
  return { id: String(o.id || 'custom').slice(0, 60), name: String(o.name || 'CUSTOM').slice(0, 40).toUpperCase(),
    bpm: clampBpm(o.bpm), cam: CAM_NAMES.includes(o.cam) ? o.cam : 'left', seed: Math.floor(+o.seed) || 1, bars, checkpoints };

function decodeStage(str) {

}
// practice: start at bar `from` with the tempo, camera and gravity that are in effect there
function practiceSlice(st, from) {
  if (!from || from >= st.bars.length) return st;
  let bpm = st.bpm, cam = st.cam, g = 1;
  for (const c of st.checkpoints) if (c.bar <= from) { if (c.bpm) bpm = c.bpm; if (c.cam) cam = c.cam; }
  for (let b = 0; b < from; b++) for (const ch of st.bars[b]) if (ch === 'U') g = -g;
  return { ...st, bpm, cam, startG: g, practiceFrom: from, bars: st.bars.slice(from),
    checkpoints: st.checkpoints.filter(c => c.bar > from).map(c => ({ ...c, bar: c.bar - from })) };
}
const hashP = new URLSearchParams(location.hash.slice(1));
const CUSTOM = hashP.has('s') ? sanitizeStage(decodeStage(hashP.get('s'))) : null;
const FROM = Math.max(0, Math.floor(+hashP.get('from') || 0));
const CHALLENGE = hashP.get('mode') === 'challenge';
const STAGE = CHALLENGE
  ? { id: 'challenge', name: 'CHALLENGE', bpm: 128, cam: 'left', seed: 1, bars: [], checkpoints: [] }
  : practiceSlice(CUSTOM || BUILTIN_STAGE, FROM);
const G0 = STAGE.startG || 1, PRACTICE = !!STAGE.practiceFrom;
addEventListener('hashchange', () => location.reload());

// ---------- geometry / physics (physics runs in BEATS, so a jump always lasts one beat at any tempo) ----------
const L = 8, H = 2.4, W = 3, T = .6;           // L = track units per beat (bigger = feels faster)
const GB = 8 * H, VYB = 4 * H;                 // gravity & jump speed in units/beat
const JUMP = new Set(['G', 'B', 'M', 'U']);
const RUNWAY = 10;                             // bars of empty floor after the finish
const nBars = CHALLENGE ? Infinity : STAGE.bars.length, endBeat = nBars * 4, endS = endBeat * L;
const cpByBar = {}; for (const c of STAGE.checkpoints) cpByBar[c.bar] = c;
let totalJumps = 0, totalDodges = 0;
for (const b of STAGE.bars) for (const c of b) { if (JUMP.has(c)) totalJumps++; else if (c === 'D') totalDodges++; }
const AUTO = new URLSearchParams(location.search).has('auto') || hashP.has('auto');

// ---------- tempo map ----------
const tempo = [];
function buildTempo() {
  tempo.length = 0;
  let b = 0, t = 0, spb = 60 / STAGE.bpm; tempo.push({ b, t, spb, bpm: STAGE.bpm });
  for (const c of [...STAGE.checkpoints].sort((a, z) => a.bar - z.bar)) if (c.bpm) {
    const nb = c.bar * 4; t += (nb - b) * spb; b = nb; spb = 60 / c.bpm; tempo.push({ b, t, spb, bpm: c.bpm });
  }
}
buildTempo();
function segB(b) { let s = tempo[0]; for (const x of tempo) { if (x.b <= b) s = x; else break; } return s; }
const spbAt = b => segB(Math.max(0, b)).spb;
const bpmAt = b => segB(Math.max(0, b)).bpm;
function secOfBeat(b) { if (b < 0) return b * tempo[0].spb; const s = segB(b); return s.t + (b - s.b) * s.spb; }

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07020f);
scene.fog = new THREE.FogExp2(0x0b0326, 0.012);
const camera = new THREE.PerspectiveCamera(66, innerWidth / innerHeight, 0.1, 700);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.05, 0.55, 0.22);
composer.addPass(bloom);
composer.addPass(new OutputPass());
let baseFov = 66;
function resize() {
  camera.aspect = innerWidth / innerHeight;
  baseFov = camera.aspect < 0.8 ? 82 : 66;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize); resize();

scene.add(new THREE.AmbientLight(0x7050c0, 0.9));
const dl = new THREE.DirectionalLight(0xffffff, 1.1); dl.position.set(4, 10, 6); scene.add(dl);

// ---------- backdrop ----------
const sunCv = document.createElement('canvas'); sunCv.width = sunCv.height = 512;
const sunTex = new THREE.CanvasTexture(sunCv); sunTex.colorSpace = THREE.SRGBColorSpace;
function drawSun(stops) {
  const g = sunCv.getContext('2d');
  g.globalCompositeOperation = 'source-over'; g.clearRect(0, 0, 512, 512);
  const gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, stops[0]); gr.addColorStop(.5, stops[1]); gr.addColorStop(1, stops[2]);
  g.fillStyle = gr; g.beginPath(); g.arc(256, 256, 250, 0, Math.PI * 2); g.fill();
  g.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 9; i++) g.fillRect(0, 280 + i * 26, 512, 3 + i * 2.2);
  sunTex.needsUpdate = true;
}
drawSun(['#ffe46b', '#ff4fa0', '#9a1cff']);
const sun = new THREE.Mesh(new THREE.PlaneGeometry(240, 240),
  new THREE.MeshBasicMaterial({ map: sunTex, transparent: true, fog: false, depthWrite: false, color: 0xcccccc }));
sun.renderOrder = -1; scene.add(sun);

const grid = new THREE.GridHelper(700, 110, 0xffffff, 0xffffff);
grid.material.color.set(0x8a2bd0); grid.material.transparent = true; grid.material.opacity = .45; scene.add(grid);

const starGeo = new THREE.BufferGeometry(); const sp = [];
for (let i = 0; i < 1400; i++) sp.push((Math.random() - .5) * 500, Math.random() * 320 - 160, -Math.random() * 450);
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xbfe8ff, size: 2, sizeAttenuation: false, fog: false }));
scene.add(stars);

const COLS = [new THREE.Color(0x00f0ff), new THREE.Color(0xff2bd6), new THREE.Color(0xa45cff)];
const decor = [];
const decoGeos = [new THREE.IcosahedronGeometry(1.6, 0), new THREE.OctahedronGeometry(1.5, 0), new THREE.TorusGeometry(1.4, .35, 6, 12), new THREE.TetrahedronGeometry(1.6, 0)];
for (let i = 0; i < 26; i++) {
  const m = new THREE.Mesh(decoGeos[i % 4], new THREE.MeshBasicMaterial({ color: COLS[i % 3], wireframe: true, toneMapped: false }));
  m.userData.ci = i % 3;
  m.userData.spin = new THREE.Vector3(Math.random(), Math.random(), Math.random()).multiplyScalar(1.2);
  scene.add(m); decor.push(m);
}
function placeDecor(m, z, baseY) {
  const side = Math.random() < .5 ? -1 : 1;
  m.position.set(side * (9 + Math.random() * 26), baseY + (Math.random() * 26 - 13), z);
  m.scale.setScalar(.6 + Math.random() * 1.6);
}

// speed streaks
const streakMat = new THREE.MeshBasicMaterial({ color: 0xbff4ff, toneMapped: false, transparent: true, opacity: .4, blending: THREE.AdditiveBlending, depthWrite: false });
const streakGeo = new THREE.BoxGeometry(.035, .035, 1), streaks = [];
for (let i = 0; i < 70; i++) { const m = new THREE.Mesh(streakGeo, streakMat); m.visible = false; m.userData.fresh = true; scene.add(m); streaks.push(m); }
function placeStreak(m, z) {
  const a = Math.random() * Math.PI * 2, r = 5 + Math.random() * 11;
  m.position.set(camera.position.x + Math.cos(a) * r, camera.position.y + Math.sin(a) * r * .8, z);
}

// ---------- materials ----------
const stripMats = COLS.map(c => new THREE.MeshBasicMaterial({ color: c.clone(), toneMapped: false }));
const lineMats = COLS.map(c => new THREE.LineBasicMaterial({ color: c.clone(), toneMapped: false, transparent: true, opacity: .7 }));
const barMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(0xff2b6a), toneMapped: false, transparent: true, opacity: .92 });
const crushMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(0xff9a1c), toneMapped: false });
const crushEdgeMat = new THREE.LineBasicMaterial({ color: 0xffffff, toneMapped: false });
const rodMat = new THREE.MeshStandardMaterial({ color: 0x3a2a55, metalness: .8, roughness: .3 });
const warnMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(0xff9a1c), toneMapped: false, transparent: true, opacity: .35, side: THREE.DoubleSide, depthWrite: false });
const portalMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(0x6bff9e), toneMapped: false });
const portalDiscMat = new THREE.MeshBasicMaterial({ color: 0x6bff9e, toneMapped: false, transparent: true, opacity: .18, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false });
const gateMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(0xffe46b), toneMapped: false });
const barGeo = new THREE.BoxGeometry(W - .2, .7, .3);
const wallGeo = new THREE.BoxGeometry(W - .2, 1.1, .35);
const crushGeo = new THREE.BoxGeometry(W - .3, .9, 1.6), crushEdges = new THREE.EdgesGeometry(crushGeo);
const rodGeo = new THREE.CylinderGeometry(.18, .18, 8, 8);
const warnGeo = new THREE.PlaneGeometry(W - .2, 2);
const portalGeo = new THREE.TorusGeometry(1.5, .12, 8, 40), portalDiscGeo = new THREE.CircleGeometry(1.45, 32);
const gateGeo = new THREE.TorusGeometry(2.7, .1, 6, 48, Math.PI), finishGeo = new THREE.TorusGeometry(3.4, .16, 6, 48, Math.PI);
const gridCv = document.createElement('canvas'); gridCv.width = gridCv.height = 128;
{ const g = gridCv.getContext('2d'); g.fillStyle = '#120826'; g.fillRect(0, 0, 128, 128);
  g.strokeStyle = '#ffffff'; g.lineWidth = 3; g.strokeRect(2, 2, 124, 124);
  g.fillStyle = '#ffffff'; g.fillRect(60, 60, 8, 8); }
const tileColor = new THREE.Color(0x2ee8ff);   // shared platform glow colour (themed)

// ---------- colour themes (challenge mode rotates through these every level) ----------
const THEMES = [
  { name: 'SYNTHWAVE',   cols: [0x00f0ff, 0xff2bd6, 0xa45cff], bg: 0x07020f, fog: 0x0b0326, grid: 0x8a2bd0, tile: 0x2ee8ff, stars: 0xbfe8ff, sun: ['#ffe46b', '#ff4fa0', '#9a1cff'] },
  { name: 'TOXIC',       cols: [0x7dff3a, 0xe8ff3a, 0x00ffa8], bg: 0x020a04, fog: 0x05160b, grid: 0x2a9a4a, tile: 0x7dff3a, stars: 0xd8ffc0, sun: ['#f4ff8a', '#7dff3a', '#008a5a'] },
  { name: 'GLACIER',     cols: [0x9fe8ff, 0xffffff, 0x4a8cff], bg: 0x020814, fog: 0x071733, grid: 0x3a6ad0, tile: 0x9fe8ff, stars: 0xffffff, sun: ['#ffffff', '#9fe8ff', '#3a5aff'] },
  { name: 'ULTRAVIOLET', cols: [0xb05cff, 0xff3af0, 0x5a3aff], bg: 0x06010f, fog: 0x12032a, grid: 0x6a20c0, tile: 0xc07cff, stars: 0xe0c8ff, sun: ['#ffb0ff', '#b05cff', '#3a10a0'] },
  { name: 'DEEP SEA',    cols: [0x00b4ff, 0x3affff, 0x2a5aff], bg: 0x010812, fog: 0x021a2a, grid: 0x0a5a9a, tile: 0x3affff, stars: 0xc0f0ff, sun: ['#d0ffff', '#00b4ff', '#0a2a8a'] }
];
let themeTo = null, themeT = 0;
function setTheme(i, instant) {
  const th = THEMES[i % THEMES.length], C = c => new THREE.Color(c);
  themeTo = { cols: th.cols.map(C), bg: C(th.bg), fog: C(th.fog), grid: C(th.grid), tile: C(th.tile), stars: C(th.stars) };
  themeT = 0; drawSun(th.sun);
  if (instant) applyTheme(1);
}
function applyTheme(k) {
  const t = themeTo; if (!t) return;
  COLS.forEach((c, i) => c.lerp(t.cols[i], k));

function flash(col, op, ms) { flashEl.style.background = col; flashEl.animate([{ opacity: op }, { opacity: 0 }], { duration: ms }); }
const mult = () => 1 + Math.floor(combo / 8);
function addCombo() { combo++; stats.maxCombo = Math.max(stats.maxCombo, combo); }

// ---------- gameplay ----------
const gameT = () => ac.currentTime - (ac.outputLatency || 0) - startTime;
function tryJump() {
  if (state !== 'play' || P1.dead) return;
  if (!(P1.ground || P1.coyote > 0)) { P1.buffer = .16; return; }
  doJump(Math.max(P1.s, beatOfSec(gameT()) * L));
}
function doJump(s) {
  P1.ground = false; P1.coyote = 0; P1.buffer = 0; P1.vy = P1.g * VYB; flipT = 0; P1.squash = 1.3; P1.sqv = 0;
  jumpSfx(); judge(s);
}
function judge(s) {
  const i = Math.round(s / L);
  if (!JUMP.has(cells[i]) || judged.has(i)) return;
  judged.add(i);
  const d = (s / L - i) * spbAt(i), a = Math.abs(d);
  let txt, col, pts;
  if (a < .045) { txt = 'PERFECT'; col = '#00f0ff'; pts = 100; addCombo(); perfectKick = 1; stats.perfect++; }
  else if (a < .09) { txt = 'GREAT'; col = '#ff6fe0'; pts = 60; addCombo(); stats.great++; }
  else { txt = 'GOOD'; col = '#b48cff'; pts = 25; combo = 0; stats.good++; }
  score += pts * mult();
  showJudge(txt, col, a < .045 ? '' : d < 0 ? 'EARLY' : 'LATE'); updateHud();
}
function land(p) {
  P1.ground = true; P1.y = p.surf; P1.vy = 0; P1.groundSurf = p.surf; P1.camSurf = p.surf; flipT = -1; pivot.rotation.x = 0;
  P1.squash = .62; P1.sqv = 0;
  if (P1.buffer > 0 && state === 'play') doJump(P1.s);
}
function flipGravity(o) {
  P1.g = -P1.g; P1.camSurf = o.newSurf; o.flash = 1; fovKick = 1;
  flash('#6bff9e', .3, 300); showJudge('GRAVITY FLIP', '#6bff9e');
}
function hitGate(o) {
  o.passed = true; o.flash = 1;
  if (o.finish) return;
  const cp = o.cp;
  if (cp.cam && cp.cam !== camPreset) { camPreset = cp.cam; camSnap = true; }
  fovKick = 1.2; score += 100 * mult(); updateHud();
  flash('#ffffff', .4, 260);
  if (cp.level !== undefined) {
    chLevel = cp.level; bpmShown = 0; setTheme(cp.theme);
    showJudge(`LEVEL ${cp.level + 1}`, '#ffe46b', `${THEMES[cp.theme % THEMES.length].name} · ${cp.bpm} BPM`);
  } else showJudge('CHECKPOINT', '#ffe46b', cp.bpm ? `${cp.bpm} BPM` : '');
}
function die() {
  if (P1.dead || state !== 'play') return;
  P1.dead = true; state = 'dead'; deadAt = performance.now();
  cube.visible = false; crashSfx();
  master.gain.cancelScheduledValues(ac.currentTime); master.gain.setTargetAtTime(0, ac.currentTime, .08);
  flash('#ff2bd6', .55, 450);
  burst(26, P1.x, P1.y + P1.g * .4, -P1.s, [stripMats[1], stripMats[0], stripMats[1]], 9);
  if (CHALLENGE) {
    const rank = AUTO ? -1 : recordRun(chTime, score, chLevel);
    setTimeout(() => {
      $('overTitle').textContent = 'YOU SURVIVED';
      $('finalScore').textContent = fmtTime(chTime);
      $('reachLine').textContent = `SCORE ${score} · LEVEL ${chLevel + 1}`;
      $('bestLine').innerHTML = rank === 0 ? '<b style="color:#ffe46b">★ NEW RECORD ★</b>' : rank > 0 ? `<b style="color:#ffe46b">TOP 10 · #${rank + 1}</b>` : '';
      $('overBoard').innerHTML = boardHtml(rank);
      $('overScreen').classList.remove('hidden');
    }, 1000);
    return;
  }
  saveBest();
  setTimeout(() => {
    $('finalScore').textContent = score; $('bestLine').textContent = `BEST ${best}`;
    $('reachLine').textContent = `REACHED ${Math.max(0, Math.min(99, Math.floor(P1.s / endS * 100)))}%`;
    $('overScreen').classList.remove('hidden');
  }, 1000);
}
function saveBest() { if (score > best && !AUTO && !PRACTICE) { best = score; try { localStorage.setItem(bestKey, best); } catch (e) {} } }
function finish() {
  state = 'clear'; clearAt = performance.now(); P1.finishBeat = P1.beat; P1.finishS = P1.s; P1.buffer = 0;
  showJudge('FINISH!', '#ffe46b'); flash('#ffe46b', .45, 600); fovKick = 1.5;
  burst(60, P1.x, P1.y + P1.g * 1.5, -P1.s - 4, [stripMats[0], stripMats[1], stripMats[2], gateMat], 14);
  const acc = (stats.perfect + stats.great * .6 + stats.good * .25 + stats.dodge) / Math.max(1, totalJumps + totalDodges);
  const rank = acc >= .92 ? 'S' : acc >= .78 ? 'A' : acc >= .6 ? 'B' : 'C';
  saveBest();
  setTimeout(() => {
    $('rank').textContent = rank; $('clearScore').textContent = score;
    $('clearStats').innerHTML = `ACCURACY ${(acc * 100).toFixed(1)}%<br>PERFECT ${stats.perfect} · GREAT ${stats.great} · GOOD ${stats.good}<br>DODGES ${stats.dodge} · MAX COMBO ${stats.maxCombo}`;
    $('clearBest').textContent = `BEST ${best}`;
    $('clearScreen').classList.remove('hidden');
  }, 1800);
}
function update(t, dt) {
  const beat = beatOfSec(t), prevBeat = P1.beat, dtb = Math.min(.25, Math.max(0, beat - prevBeat));
  P1.beat = beat;
  const playing = state === 'play';
  const s = playing ? beat * L : P1.finishS + L * 2 * (1 - Math.exp(-(beat - P1.finishBeat) / 2));
  P1.s = s;
  while (!gen.done && gen.i * L < s + 260) genBar();
  // cleanup behind
  while (plats.length && plats[0].e < s - 40) disposeObj(plats.shift().mesh);
  while (props.length && props[0].s < s - 30) scene.remove(props.shift().mesh);

  const g = P1.g, p = platAt(s);
  if (P1.ground) {
    if (!p || p.g !== g) { P1.ground = false; P1.vy = 0; P1.coyote = .09; }
    else { P1.y = p.surf; P1.groundSurf = p.surf; P1.camSurf = p.surf; }
  }
  if (!P1.ground) {
    P1.coyote -= dt; P1.vy -= g * GB * dtb; P1.y += P1.vy * dtb;
    if (p && p.g === g) {
      const h = g * (P1.y - p.surf);
      if (g * P1.vy <= 0 && h <= 0 && h > -.75) land(p);
      else if (h < -.75 && playing) return die();
    }
    if (g * (P1.y - P1.groundSurf) < -22) return die();
  }
  P1.x += (targetX(s, P1.x) - P1.x) * Math.min(1, dt * 14);
  if (!playing) return;

  for (const o of props) {
    if (o.s > s + 2) break;
    if (o.type === 'gate') { if (!o.passed && s >= o.s) hitGate(o); continue; }
    if (o.type === 'U') {
      if (!o.used && s >= o.s) { o.used = true; if (!P1.ground && g * (P1.y - P1.groundSurf) > .3) flipGravity(o); }
      continue;
    }
    const h = o.g * (P1.y - o.surf), dx = Math.abs(o.s - s);
    if (o.type === 'B' && dx < .55 && h < .62) return die();
    if (o.type === 'M' && dx < .5 && h < wallH(beat) - .1) return die();
    if (o.type === 'D') {
      if (dx < .95 && h + .8 > crushH(beat) + .05) return die();
      if (!o.done && s > o.s + 1) { o.done = true; stats.dodge++; addCombo(); score += 50 * mult(); showJudge('DODGE', '#ff9a1c'); updateHud(); }
    }
  }
  if (AUTO) { const i = Math.floor(beat); if (JUMP.has(cells[i]) && !autoDone.has(i)) { autoDone.add(i); tryJump(); } }
  P1.buffer -= dt;
  setBpm(bpmAt(beat));
  if (CHALLENGE) { chTime = Math.max(0, secOfBeat(beat)); setTime(chTime); }
  if (s > 0 && Math.floor(beat) !== Math.floor(prevBeat)) { score += 5; updateHud(); }
  if (beat >= endBeat) finish();
}

// ---------- input ----------
const canRestart = () => (state === 'dead' && performance.now() - deadAt > 1300) || (state === 'clear' && performance.now() - clearAt > 2000);
renderer.domElement.addEventListener('pointerdown', e => { e.preventDefault(); tryJump(); });
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (state === 'play') tryJump(); else if (state === 'menu' || canRestart()) startRun();
  }
});
function startRun() {
  initAudio(); ac.resume();
  for (const id of ['startScreen', 'overScreen', 'clearScreen']) $(id).classList.add('hidden');
  resetWorld();
  master.gain.cancelScheduledValues(ac.currentTime); master.gain.setValueAtTime(.75, ac.currentTime);
  startTime = ac.currentTime + .15 + 4 * tempo[0].spb; nextBeat = -4;
  lastT = gameT(); P1.beat = beatOfSec(lastT); state = 'play';
}
$('startBtn').addEventListener('pointerdown', e => { e.stopPropagation(); startRun(); });
$('startScreen').addEventListener('pointerdown', () => startRun());
$('retryBtn').addEventListener('pointerdown', e => { e.stopPropagation(); startRun(); });
$('overScreen').addEventListener('pointerdown', () => { if (canRestart()) startRun(); });
$('againBtn').addEventListener('pointerdown', e => { e.stopPropagation(); startRun(); });
$('clearScreen').addEventListener('pointerdown', () => { if (canRestart()) startRun(); });

// ---------- cameras ----------
// x: sideways offset (+ = cube appears on the LEFT of screen), up: height, back: distance behind, look: aim height, ahead: aim distance
const CAMS = {
  left:  { x: 3,   up: 3.6, back: 7.4, look: .8,  ahead: 9 },
  right: { x: -3,  up: 3.6, back: 7.4, look: .8,  ahead: 9 },
  low:   { x: 1.3, up: 1.5, back: 5.2, look: 1.2, ahead: 14 },
  high:  { x: .6,  up: 8,   back: 6.5, look: 0,   ahead: 6 }
};

// ---------- loop ----------
resetWorld();
let lastNow = performance.now() / 1000, blinkT = 2, idleT = 0;
const tmpV = new THREE.Vector3();
window.NH = { P1, STAGE, get state() { return state; }, get score() { return score; }, stats };
function frame() {
  requestAnimationFrame(frame);
  const now = performance.now() / 1000, rdt = Math.min(.05, now - lastNow); lastNow = now;
  let beatPos;
  const moving = state === 'play' || state === 'clear';
  if (moving) {
    schedule();
    const t = gameT(), dt = Math.min(.05, Math.max(0, t - lastT)); lastT = t;
    update(t, dt); beatPos = P1.beat;
  } else beatPos = now / spbAt(P1.beat);
  if (state === 'dead' || state === 'clear') {
    for (const m of shards) { m.userData.v.y -= 22 * rdt; m.position.addScaledVector(m.userData.v, rdt); m.rotation.x += rdt * 8; m.rotation.y += rdt * 6; }
  }
  const g = P1.g, vNow = L / spbAt(P1.beat);

  // colour theme transition
  if (themeTo) { themeT += rdt; applyTheme(themeT > 1.2 ? 1 : Math.min(1, rdt * 3.5)); }

  // beat pulse
  const ph = ((beatPos % 1) + 1) % 1, pulse = Math.exp(-ph * 5);
  stripMats.forEach((m, i) => m.color.copy(COLS[i]).multiplyScalar(1 + pulse * 1.8));
  lineMats.forEach((m, i) => m.color.copy(COLS[i]).multiplyScalar(.8 + pulse));
  barMat.color.setRGB(1 + pulse * 1.5, .17, .42 + pulse * .4);
  crushMat.color.setRGB(1 + pulse, .6, .11);
  portalMat.color.setRGB(.42, 1 + pulse * 1.5, .62);
  gateMat.color.setRGB(1 + pulse, .9 + pulse, .42);
  grid.material.opacity = .3 + pulse * .35;
  perfectKick *= Math.pow(.02, rdt);
  bloom.strength = 1.0 + pulse * .25 + perfectKick * .8;
  bodyMat.emissiveIntensity = .5 + pulse * .45;

  // props animation
  const crushU = (((beatPos - .5) % 1) + 1) % 1;
  warnMat.opacity = .2 + .5 * Math.pow(Math.max(0, Math.cos(crushU * Math.PI * 2)), 4);
  for (const o of props) {
    if (o.type === 'M') { const h = wallH(beatPos); o.wall.scale.y = Math.max(.02, h / 1.1); o.wall.position.y = h / 2; }
    else if (o.type === 'D') o.head.position.y = crushH(beatPos);
    else if (o.type === 'U' || o.type === 'gate') {
      o.ring.rotation.z += rdt * (o.type === 'U' ? 2.2 : 0);
      if (o.flash > 0) { o.flash -= rdt * 2.5; o.ring.scale.setScalar(1 + (1 - Math.max(0, o.flash)) * .9); }
    }
  }

  // cube
  cube.position.set(P1.x, P1.y, -P1.s);
  cubeRoll += ((g === 1 ? 0 : Math.PI) - cubeRoll) * Math.min(1, rdt * 12);
  cube.rotation.z = cubeRoll;
  P1.sqv += (1 - P1.squash) * 260 * rdt; P1.sqv *= Math.pow(.0015, rdt); P1.squash += P1.sqv * rdt;
  const sq = Math.max(.4, P1.squash);
  pivot.scale.set(1 / Math.sqrt(sq), sq, 1 / Math.sqrt(sq)); pivot.position.y = .4 * sq;
  if (flipT >= 0 && moving) {
    flipT += rdt; const f = Math.min(1, flipT / spbAt(P1.beat)), e = 1 - Math.pow(1 - f, 3);
    pivot.rotation.x = -e * Math.PI * 2;
  }
  blinkT -= rdt; const blink = blinkT < 0 && blinkT > -.12;
  if (blinkT < -.12) blinkT = 2 + Math.random() * 3;
  eyes.forEach(e => e.scale.y = blink ? .15 : 1.25);
  pupils.forEach(pu => pu.visible = !blink);

  // trail
  if (moving && cube.visible) {
    const m = trail[trailIdx = (trailIdx + 1) % trail.length];
    m.visible = true; m.userData.life = 1; m.position.set(P1.x + (Math.random() - .5) * .3, P1.y + g * (.2 + Math.random() * .4), -P1.s + .45);
  }
  for (const m of trail) if (m.visible) { m.userData.life -= rdt * 3; if (m.userData.life <= 0) m.visible = false; else m.scale.setScalar(m.userData.life); }

  // camera
  if (state !== 'dead') {
    const lh = g * (P1.y - P1.camSurf);
    const followY = P1.camSurf + g * Math.min(0, Math.max(lh, -6));
    camY += (followY - camY) * Math.min(1, rdt * 5);
  }
  camRoll += ((g === 1 ? 0 : Math.PI) - camRoll) * Math.min(1, rdt * 6);
  const cr = Math.cos(camRoll), sr = Math.sin(camRoll);
  fovKick *= Math.pow(.08, rdt);
  camera.fov = baseFov + (state === 'menu' ? 0 : Math.max(0, vNow - 17) * 1.2) + fovKick * 9;
  camera.updateProjectionMatrix();
  if (state === 'menu') {
    const a = now * .35;
    camera.up.set(0, 1, 0);
    camera.position.set(P1.x + Math.sin(a) * 3.5 + 1.5, camY + 2.4, -P1.s + 5.5 + Math.cos(a) * .8);
    camera.lookAt(P1.x, camY + .5, -P1.s - 2);
  } else if (state === 'clear') {
    const a = (performance.now() - clearAt) / 1000 * .45;
    camera.up.set(-sr, cr, 0);
    tmpV.set(P1.x + Math.sin(a) * 6.5, camY + g * 2.6, -P1.s + Math.cos(a) * 6.5);
    camera.position.lerp(tmpV, Math.min(1, rdt * 3));
    camera.lookAt(P1.x, camY + g * .5, -P1.s);
  } else {
    const cp = CAMS[camPreset] || CAMS.left;
    const ox = cp.x * cr - cp.up * sr, oy = cp.x * sr + cp.up * cr;   // offset rotated around the track by the gravity roll
    const lx = -cp.look * sr, ly = cp.look * cr;
    camera.up.set(-sr, cr, 0);
    tmpV.set(P1.x * .55 + ox, camY + oy, -P1.s + cp.back);
    if (camSnap) { camera.position.copy(tmpV); camSnap = false; }
    else {
      camera.position.x += (tmpV.x - camera.position.x) * Math.min(1, rdt * 6);
      camera.position.y += (tmpV.y - camera.position.y) * Math.min(1, rdt * 6);
      if (state === 'play') camera.position.z = tmpV.z;
    }
    camera.lookAt(P1.x * .5 + lx, camY + ly, (state === 'play' ? -P1.s : camera.position.z - cp.back) - cp.ahead);
    camera.rotation.z += Math.sin(beatPos * Math.PI) * .012;
  }

  // speed streaks
  streakMat.opacity = Math.min(.55, .14 + Math.max(0, vNow - 17) * .05 + pulse * .1);
  for (const m of streaks) {
    m.visible = state === 'play';
    if (!m.visible) { m.userData.fresh = true; continue; }
    if (m.userData.fresh) { placeStreak(m, camera.position.z - 5 - Math.random() * 145); m.userData.fresh = false; }
    else if (m.position.z > camera.position.z + 3) placeStreak(m, camera.position.z - 110 - Math.random() * 40);
    m.scale.z = 1.5 + vNow * .3;
  }

  // backdrop follows (flips to the other side when gravity is flipped)
  const sgn = cr >= 0 ? 1 : -1;
  sun.position.set(camera.position.x, camY + 30 * sgn, camera.position.z - 430); sun.rotation.z = sgn > 0 ? 0 : Math.PI;
  grid.position.set(0, camY - 16 * sgn, Math.round(camera.position.z / 6.36) * 6.36);
  stars.position.set(camera.position.x * .5, camY, camera.position.z);
  for (const m of decor) {
    m.rotation.x += m.userData.spin.x * rdt; m.rotation.y += m.userData.spin.y * rdt;
    if (m.position.z > camera.position.z + 12) placeDecor(m, camera.position.z - 240 - Math.random() * 40, camY);
  }
  progBar.style.width = (state === 'menu' ? 0 : Math.max(0, Math.min(100, P1.s / endS * 100))) + '%';
  composer.render();
}
frame();
</script>
</body>
</html>
